services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: local-root-only
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - dv_db:/var/lib/mysql

  wordpress:
    image: wordpress:6.8.2-php8.1-apache
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
    ports:
      - "8090:80"
    volumes:
      - dv_wp:/var/www/html
      - ./wordpress/wp-content/plugins/digiventures-application:/var/www/html/wp-content/plugins/digiventures-application

  wpcli:
    image: wordpress:cli-php8.1
    depends_on:
      wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    user: "33:33"
    volumes:
      - dv_wp:/var/www/html
      - ./wordpress/wp-content/plugins/digiventures-application:/var/www/html/wp-content/plugins/digiventures-application
    entrypoint: ["wp", "--path=/var/www/html"]

volumes:
  dv_db:
  dv_wp:
