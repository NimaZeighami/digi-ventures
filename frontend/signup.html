<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ساخت حساب کاربری دیجی‌ونچرز" />
  <link rel="icon" type="image/png" href="/assets/images/digiventures-favicon.png" />
  <title>ثبت‌نام | دیجی‌ونچرز</title>
</head>
<body>
  <main class="auth-shell flex items-center justify-center">
    <section class="auth-panel" aria-labelledby="signup-title">
      <aside class="auth-aside">
        <a href="/" class="brand-logo relative z-10 self-start" aria-label="صفحه اصلی دیجی‌ونچرز"><span class="brand-logo-mark" aria-hidden="true"></span><span class="brand-logo-wordmark" aria-hidden="true"></span></a>
        <div class="relative z-10"><span class="section-label">همراهی از ابتدا</span><h1 class="mt-3 text-4xl font-bold leading-tight">برای ساختن آینده آماده‌اید؟</h1><p class="mt-5 max-w-sm leading-relaxed text-white/65">با ایجاد حساب، مسیر ارتباط با تیم سرمایه‌گذاری دیجی‌ونچرز را شروع کنید.</p></div>
        <p class="relative z-10 text-sm text-white/45">سرمایه‌گذاری بر آینده کسب‌وکارها.</p>
      </aside>
      <div class="auth-content"><div class="flex items-center justify-between"><a href="/" class="text-sm text-brand-muted transition-colors hover:text-brand-green">بازگشت به سایت</a><a href="/" class="brand-logo lg:hidden" aria-label="صفحه اصلی دیجی‌ونچرز"><span class="brand-logo-mark" aria-hidden="true"></span><span class="brand-logo-wordmark !text-brand-dark" aria-hidden="true"></span></a></div>
        <div class="mx-auto flex w-full max-w-md flex-1 flex-col justify-center py-8"><span class="section-label">ایجاد حساب</span><h1 id="signup-title" class="text-3xl font-bold text-brand-darkText">ثبت‌نام</h1><p class="mt-3 leading-relaxed text-brand-muted">با ایمیل کاری خود حساب کاربری بسازید.</p>
          <form class="mt-7 space-y-5" data-auth-form data-endpoint="/api/auth/signup" data-success-message="حساب شما ساخته شد. برای تأیید ایمیل، صندوق ورودی خود را بررسی کنید.">
            <div><label class="form-label" for="signup-email">ایمیل</label><input class="form-input" id="signup-email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com" required /></div>
            <div><label class="form-label" for="signup-password">گذرواژه</label><div class="auth-input-wrap"><input class="form-input pl-20" id="signup-password" name="password" type="password" autocomplete="new-password" minlength="8" aria-describedby="password-help" data-password required /><button class="auth-password-toggle" type="button" data-password-toggle="signup-password" aria-label="نمایش گذرواژه">نمایش</button></div><p id="password-help" class="mt-2 text-xs text-brand-muted">حداقل ۸ کاراکتر انتخاب کنید.</p></div>
            <div><label class="form-label" for="signup-password-confirmation">تکرار گذرواژه</label><div class="auth-input-wrap"><input class="form-input pl-20" id="signup-password-confirmation" name="password_confirmation" type="password" autocomplete="new-password" minlength="8" data-password-confirmation required /><button class="auth-password-toggle" type="button" data-password-toggle="signup-password-confirmation" aria-label="نمایش گذرواژه">نمایش</button></div></div>
            <div class="auth-feedback" data-auth-feedback role="status" aria-live="polite" tabindex="-1"></div><button class="btn-primary w-full" type="submit">ایجاد حساب</button>
          </form><p class="mt-6 text-center text-sm text-brand-muted">حساب دارید؟ <a class="font-semibold text-brand-green hover:text-brand-dark" href="/login.html">وارد شوید</a></p>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
