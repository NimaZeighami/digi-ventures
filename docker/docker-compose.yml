services:
  db:
    image: mariadb:10
    environment:
      MYSQL_ROOT_PASSWORD: wordpress
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 10s
      timeout: 5s
      retries: 5

  wordpress:
    image: wordpress:6
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_DEBUG: 1
    volumes:
      - wordpress_data:/var/www/html
      - ../wordpress-theme/digiventures-theme:/var/www/html/wp-content/themes/digiventures-theme
      - ../wordpress-plugin/digiventures-core:/var/www/html/wp-content/plugins/digiventures-core
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  wp-cli:
    image: wordpress:cli
    user: 33:33
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_TABLE_PREFIX: wp_
    volumes:
      - wordpress_data:/var/www/html
      - ../wordpress-theme/digiventures-theme:/var/www/html/wp-content/themes/digiventures-theme
      - ../wordpress-plugin/digiventures-core:/var/www/html/wp-content/plugins/digiventures-core
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["echo 'wp-cli ready'; tail -f /dev/null"]

volumes:
  db_data:
  wordpress_data:
